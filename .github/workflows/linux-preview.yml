name: Linux preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Linux/**', '.github/workflows/linux-preview.yml', 'Tools/RavenDenoise.c', 'Notices/**']
permissions:
  contents: read
concurrency:
  group: raven-linux-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/Linux
      RAVEN_TEST_ROOT: ${{ github.workspace }}/.build/linux-tests
      RAVEN_CI_MODEL_ROOT: ${{ github.workspace }}/.build/linux-inference
      QT_QPA_PLATFORM: offscreen
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 xvfb xauth pulseaudio libpipewire-0.3-0
          python -m pip install -r Linux/requirements.txt pyinstaller==6.13.0
      - name: Core and isolated desktop tests
        run: |
          python -m unittest discover -s Linux/tests -p 'test_*.py' -v
          python Linux/tests/smoke_ui.py
      - uses: actions/cache@v4
        id: nativecache
        with:
          path: |
            .build/linux-audio.cpp
            .build/linux-rnnoise
            .build/linux-raven-denoise
          key: raven-linux-native-gcc13-bdf78b9-70f1d25-v1
      - name: Build pinned native CPU engine and RNNoise
        run: |
          Linux/scripts/build-engine.sh
          Linux/scripts/build-denoiser.sh
      - uses: actions/cache/save@v4
        if: steps.nativecache.outputs.cache-hit != 'true'
        with:
          path: |
            .build/linux-audio.cpp
            .build/linux-rnnoise
            .build/linux-raven-denoise
          key: raven-linux-native-gcc13-bdf78b9-70f1d25-v1
      - name: Native cleanup acceptance
        env:
          RAVEN_TEST_DENOISER: ${{ github.workspace }}/.build/linux-raven-denoise
        run: python -m unittest discover -s Linux/tests -p 'test_*.py' -v
      - name: Actual local-model CPU generation
        env:
          RAVEN_VO_ENGINE: ${{ github.workspace }}/.build/linux-audio.cpp/build/raven-linux/bin/audiocpp_cli
        run: python Linux/tests/acceptance.py
      - name: Package desktop preview
        run: Linux/scripts/package.sh
      - name: Verify frozen application starts without a source checkout
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/dist/linux/RavenVO/_internal/resources/engine/audiocpp_cli" --help > "$GITHUB_WORKSPACE/.build/frozen-engine-help.log" 2>&1
          unset PYTHONPATH
          QT_QPA_PLATFORM=offscreen timeout 30s "$GITHUB_WORKSPACE/dist/linux/RavenVO/RavenVO" --smoke-test > "$GITHUB_WORKSPACE/.build/frozen-smoke.log" 2>&1
          QT_QPA_PLATFORM=xcb xvfb-run -a timeout 30s "$GITHUB_WORKSPACE/dist/linux/RavenVO/RavenVO" --smoke-test >> "$GITHUB_WORKSPACE/.build/frozen-smoke.log" 2>&1
      - name: Preserve Ubuntu-validated packages
        uses: actions/upload-artifact@v4
        with:
          name: Raven-VO-Ubuntu-validated-amd64
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/SHA256SUMS
      - name: Install and launch the actual deb on Debian 13
        timeout-minutes: 10
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=20s 480s docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$GITHUB_WORKSPACE/dist/linux:/packages:ro" debian:13-slim bash -euxc '
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update
            apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y /packages/*-amd64.deb xvfb xauth
            QT_QPA_PLATFORM=xcb xvfb-run -a timeout 30s /opt/raven-vo/RavenVO --smoke-test
          ' 2>&1 | tee .build/debian-smoke.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Raven-VO-Linux-preview-amd64
          path: |
            dist/linux/*.tar.gz
            dist/linux/*.deb
            dist/linux/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Linux-validation-evidence
          path: |
            .build/linux-tests/linux-ui-smoke.png
            .build/linux-inference/native-engine.log
            .build/linux-inference/samples/linux-real-inference.wav
            .build/frozen-smoke.log
            .build/debian-smoke.log
